services:
  complaints-proxy:
    image: nginx:1.27-alpine
    container_name: complaints-proxy-m
    restart: unless-stopped
    depends_on:
      - complaints-backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/complaints-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

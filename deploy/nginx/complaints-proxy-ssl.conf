server {
    listen 80;
    server_name _;

    # TODO: replace with your real domain (example: complaints-api.example.com)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # TODO: replace with real cert paths for your domain
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    location /complaints_m/api/ {
        proxy_pass http://complaints-backend:3018/complaints_m/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://complaints-backend:3018/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
